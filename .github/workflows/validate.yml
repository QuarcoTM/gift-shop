name: Validate storefront
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run syntax and structure checks
        run: npm run check

      - name: Validate locally hosted realistic WebP photos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          names = ['hero', 'christmas', 'easter', 'valentine', 'womens_day', 'martenitsa', 'everyday', 'baby', 'kids', 'occasions', 'about', 'bulk']
          for name in names:
              photo = Path('assets/images') / (name + '.webp')
              data = photo.read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'Invalid WebP: {photo}'
              assert 10000 < len(data) < 350000, f'Unexpected asset size: {photo}'
              print('Valid local photo:', photo, len(data))
          PY
